version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: echo-assist-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

