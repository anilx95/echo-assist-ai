name: echo_assist_ai
description: "ECHO-ASSIST AI - AI for Inclusive Mobility"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1

  # Accessibility / voice
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # Camera & sensors
  camera: ^0.11.0+2

  # Location & maps
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Bluetooth Low Energy (ESP32 smart cane)
  flutter_blue_plus: ^1.32.12

  # Local storage for settings and emergency contacts
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1

  # Vibration feedback
  vibration: ^2.0.1

  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
